# polyphony-xbt — testnet4, docker compose, primary instance.
# Env overrides use the POLYPHONY prefix with __ separator,
# e.g. POLYPHONY__STORAGE__INSTANCE_ID.

[general]
stage_timeout_secs = 1800
stage_message_queue = 20
# Rollback buffer depth (blocks). testnet4 sees deep reorgs (30+ blocks observed);
# a reorg deeper than this buffer is unrecoverable and requires an instance resync.
buffer_size = 128

[source]
type = "Compressor"
url = "http://compressor:50051"
max_items_per_page = 20
use_mempool = true

[intersect]
type = "Origin"

[storage]
type = "TiKV"
connection_params = "pd:2379"
redis_address = "redis://redis:6379"
network = "testnet"
dataplane_id = 0
instance_id = 0

# Inscription and BRC-20 reducers are commented out to keep the local test light
# (testnet4 is inscription-heavy); uncomment to index them. Note: API endpoints
# that require them (/addresses/<addr>/utxos, /assets/inscriptions/*,
# /assets/brc20/*) return errors while they are disabled.

