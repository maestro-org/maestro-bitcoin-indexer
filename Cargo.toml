# Workspace for the TiKV-side services, which share the timbre-xbt key schema and a
# common `bitcoin` crate version. compressor-xbt is intentionally NOT a member: it is
# upstream of the gRPC boundary and its `ord` fork pins an incompatible `bitcoin`
# version, so it builds standalone with its own lockfile (see services/compressor-xbt).
[workspace]
resolver = "2"
members = [
    "crates/timbre-xbt",
    "crates/timbre-xbt/macros",
    "services/polyphony-xbt",
    "services/mapi-xbt",
    "services/tikv-gc",
    "services/daw",
]
exclude = ["services/compressor-xbt"]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/maestro-org/maestro-bitcoin-indexer"

# Inherited lint debt: these lints fire on long-standing production code. They are
# allowed (not fixed) to keep the open-source release byte-close to the code that
# ran in production; burn this list down over time. CI runs clippy with
# `-D warnings`, so anything NOT listed here stays enforced.
[workspace.lints.clippy]
bind_instead_of_map = "allow"
bool_assert_comparison = "allow"
bool_comparison = "allow"
chunks_exact_to_as_chunks = "allow"
clone_on_copy = "allow"
collapsible_if = "allow"
derivable_impls = "allow"
enum_variant_names = "allow"
explicit_counter_loop = "allow"
extra_unused_lifetimes = "allow"
for_kv_map = "allow"
from_over_into = "allow"
get_first = "allow"
into_iter_on_ref = "allow"
iter_kv_map = "allow"
large_enum_variant = "allow"
legacy_numeric_constants = "allow"
len_zero = "allow"
let_and_return = "allow"
manual_map = "allow"
map_clone = "allow"
map_flatten = "allow"
match_single_binding = "allow"
module_inception = "allow"
needless_as_bytes = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
needless_return = "allow"
new_without_default = "allow"
ptr_arg = "allow"
question_mark = "allow"
redundant_closure = "allow"
redundant_field_names = "allow"
redundant_pattern_matching = "allow"
result_large_err = "allow"
search_is_some = "allow"
single_component_path_imports = "allow"
single_match = "allow"
to_string_in_format_args = "allow"
to_string_trait_impl = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_cast = "allow"
unnecessary_get_then_check = "allow"
unnecessary_map_on_constructor = "allow"
upper_case_acronyms = "allow"
useless_conversion = "allow"
useless_format = "allow"
useless_vec = "allow"
while_let_on_iterator = "allow"

[profile.release]
lto = "thin"
