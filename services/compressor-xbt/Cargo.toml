[package]
name = "compressor-xbt"
version = "0.1.0"
edition = "2021"
description = "Bitcoin light node: block storage with resolved inputs and metaprotocol enrichment, served over gRPC"
license = "Apache-2.0"
repository = "https://github.com/maestro-org/maestro-bitcoin-indexer"


[profile.release]
debug = true

[dependencies]
gasket = { version = "^0.5", features = ["derive"] }
clap = { version = "4.3.0", features = ["derive"] }
config = { version = "0.13.3", default-features = false, features = ["toml", "json"] }
rocksdb = { version = "0.22.0", default-features = false, features = ["multi-threaded-cf"] }
tonic = { version = "0.11.0", features = ["tls"] }
tonic-web = "0.11.0"
miette = { version = "5.9.0", features = ["fancy"] }
tokio = { version = "1.36.0", features = ["rt", "rt-multi-thread"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
thiserror = "1.0.30"
hex = "0.4.3"
serde = "1.0.196"
async-trait = "0.1.68"
bincode = "1.3.3"
tempfile = "3.9.0"
prost = "0.12"
serde_with = "3.4.0"
futures-core = "0.3.30"
futures-util = "0.3.30"
async-stream = "0.3.5"
actix-web = "4"
socket2 = "0.5.6"
itertools = "0.13.0"
serde_json = "1.0.117"
uuid = { version = "1.8.0", features = ["v4"] }
signal-hook = "0.3.17"
once_cell = "1.10"
bitcoin = { version = "0.32.7", features = ["serde", "rand-std"] }
ord-bitcoincore-rpc = "0.19.0"
ordinals = "0.0.15"
ord = { git = "https://github.com/maestro-org/ord", rev = "e1d5bc54a14dc8fe3f77b1cd2daa0dbc65ffff93" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.5"

[build-dependencies]
tonic-build = "0.11.0"

# Inherited lint debt — see the note in the repo root Cargo.toml.
[lints.clippy]
clone_on_copy = "allow"
collapsible_if = "allow"
from_over_into = "allow"
large_enum_variant = "allow"
manual_is_multiple_of = "allow"
map_flatten = "allow"
needless_as_bytes = "allow"
needless_borrow = "allow"
needless_return = "allow"
new_without_default = "allow"
question_mark = "allow"
redundant_locals = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
unnecessary_cast = "allow"
unnecessary_mut_passed = "allow"
unnecessary_unwrap = "allow"
unused_unit = "allow"
useless_conversion = "allow"
useless_format = "allow"

[lints.rust]
# Inherited: deprecated `Witness::tapscript` uses and one unused health field.
deprecated = "allow"
dead_code = "allow"
